services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    # A MÁGICA DO MAPEAMENTO DE PORTAS:
    # Esquerda (5433): Porta do seu Windows (para não dar conflito com a 5432 se tiver algo lá)
    # Direita (5432): Porta interna do Container (onde o Postgres realmente está)
    ports:
      - "5433:5432"
    restart: always

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
  media_volume: