services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5434:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    # Comando vem do Dockerfile (scripts/entrypoint.sh): migrate + collectstatic + gunicorn
    volumes:
      - media_volume:/app/media
    ports:
      - "8900:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Edição online do .docx — PROVA DE CONCEITO, só sobe sob demanda:
  #   docker compose --profile collabora up -d
  # O profile mantém o serviço fora de qualquer deploy que não peça por ele.
  #
  # Fluxo: o navegador carrega o editor de localhost:9980; o container do
  # Collabora chama de volta o Django em http://web:8000/wopi/... pela rede
  # interna do compose. Por isso são dois endereços diferentes nas envs do
  # serviço web (COLLABORA_SERVER_URL x COLLABORA_WOPI_HOST).
  collabora:
    image: collabora/code:latest
    profiles: ["collabora"]
    environment:
      # Allowlist de hosts WOPI: sem isso o Collabora recusa as chamadas.
      - aliasgroup1=http://web:8000
      # PoC em HTTP puro na rede local — sem TLS e sem terminação de TLS.
      - extra_params=--o:ssl.enable=false --o:ssl.termination=false
      - DONT_GEN_SSL_CERT=1
      - username=admin
      - password=admin
      - dictionaries=pt_BR en_US
    ports:
      - "9980:9980"
    cap_add:
      - MKNOD
    restart: unless-stopped

volumes:
  postgres_data:
  media_volume:
