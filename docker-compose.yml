services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5433:5432"
    restart: always

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - media_volume:/app/media
    ports:
      - "8888:8000"
    env_file:
      - .env
    depends_on:
      - db
    restart: always

  processos-worker:
    build:
      context: .
      dockerfile: Dockerfile.processos-worker
    command: python -m docgen.processos_worker
    env_file:
      - .env
    environment:
      PROCESSOS_WORKER_API_BASE_URL: http://web:8000
      PROCESSOS_WORKER_BROWSER_PROFILE: /app/.processos-browser-profile
    depends_on:
      - web
    volumes:
      - processos_worker_profile:/app/.processos-browser-profile
    restart: always

volumes:
  postgres_data:
  media_volume:
  processos_worker_profile:
