services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5433:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    # Comando vem do Dockerfile (scripts/entrypoint.sh): migrate + collectstatic + gunicorn
    volumes:
      - media_volume:/app/media
    ports:
      - "8888:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  processos-worker:
    build:
      context: .
      dockerfile: Dockerfile.processos-worker
    command: python -m docgen.processos_worker
    env_file:
      - .env
    environment:
      PROCESSOS_WORKER_TOKEN: ${PROCESSOS_WORKER_TOKEN:-processos-worker-dev-token}
      PROCESSOS_WORKER_API_BASE_URL: http://web:8000
      PROCESSOS_WORKER_BROWSER_PROFILE: /app/.processos-browser-profile
    depends_on:
      - web
    volumes:
      - processos_worker_profile:/app/.processos-browser-profile
    restart: always

volumes:
  postgres_data:
  media_volume:
  processos_worker_profile:
