{% extends 'base.html' %}

{% block title %}Novo Modelo{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        
        <div class="d-flex align-items-center mb-4 mt-2">
            <a href="{% url 'lista_templates' %}" class="btn btn-outline-secondary me-3">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2 class="fw-bold mb-0">Adicionar Novo Modelo</h2>
        </div>

        <div class="card shadow border-0">
            <div class="card-body p-5">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-4 p-4 border rounded bg-light text-center dashed-border">
                        <label for="arquivo" class="form-label fw-bold d-block mb-3">
                            <i class="fa-solid fa-cloud-arrow-up fa-2x text-primary mb-2"></i><br>
                            Selecione o arquivo .docx
                        </label>
                        <input type="file" name="arquivo" id="arquivo" class="form-control w-75 mx-auto" accept=".docx" required>
                        <div class="form-text mt-2">Certifique-se que o arquivo contém as tags <code>{% verbatim %}{{ exemplo }}{% endverbatim %}</code></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Título da Peça <span class="text-danger">*</span></label>
                        <input type="text" name="titulo" class="form-control" placeholder="Ex: Contestação Cível Padrão" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Setor <span class="text-danger">*</span></label>
                            <select name="setor" class="form-select" required>
                                <option value="">Selecione...</option>
                                {% for s in setores %}
                                    <option value="{{ s.id }}">{{ s.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Área</label>
                            <select name="area" class="form-select">
                                <option value="">Geral</option>
                                {% for a in areas %}
                                    <option value="{{ a.id }}">{{ a.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Categoria</label>
                            <select name="categoria" class="form-select">
                                <option value="">Geral</option>
                                {% for c in categorias %}
                                    <option value="{{ c.id }}">{{ c.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Descrição / Instruções</label>
                        <textarea name="descricao" class="form-control" rows="3" placeholder="Explique brevemente quando usar este modelo..."></textarea>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">
                            Continuar para Configuração <i class="fa-solid fa-arrow-right ms-2"></i>
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
