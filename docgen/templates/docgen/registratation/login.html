<!DOCTYPE html>
<html>
<head>
    <title>Login - DOC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card-login { width: 100%; max-width: 400px; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="card shadow card-login bg-white">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">DOC MDR</h3>
            <p class="text-muted">Entre para gerar documentos</p>
        </div>

        <form method="post">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="alert alert-danger py-2">Usuário ou senha incorretos.</div>
            {% endif %}

            <div class="mb-3">
                <label class="form-label">Usuário</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>

            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">ENTRAR</button>
            </div>
        </form>
    </div>
</body>
</html>
