{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow border-0 mt-5">
            <div class="card-body p-5">
                <h3 class="fw-bold mb-3">Solicitar Acesso</h3>
                <p class="text-muted small mb-4">Informe seu e-mail institucional para que a supervisão aprove seu cadastro.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label small fw-bold">E-MAIL</label>
                        <input type="email" name="email" class="form-control form-control-lg" placeholder="exemplo@mdradvocacia.com" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-3">ENVIAR SOLICITAÇÃO</button>
                    <div class="text-center mt-4">
                        <a href="{% url 'login' %}" class="text-decoration-none small text-muted">Já tem conta? Fazer Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
